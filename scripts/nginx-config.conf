# ==========================================
# CONFIGURAÇÃO NGINX - FACIL DIGITAL+
# HOSTINGER VPS
# ==========================================

server {
    listen 80;

    server_name
        facildigitalmais.com
        www.facildigitalmais.com;

    # HTTP sempre converge para a origem canônica.
    return 301 https://facildigitalmais.com$request_uri;
}


# HTTPS do host alternativo converge para a origem canônica.
#
# O certificado utilizado aqui precisa incluir
# www.facildigitalmais.com como SAN.
server {
    listen 443 ssl http2;

    server_name
        www.facildigitalmais.com;


    ssl_certificate
        /etc/letsencrypt/live/facildigitalmais.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/facildigitalmais.com/privkey.pem;

    ssl_protocols
        TLSv1.2
        TLSv1.3;

    ssl_ciphers
        HIGH:!aNULL:!MD5;


    return 301 https://facildigitalmais.com$request_uri;
}


# Única origem HTTPS encaminhada para o Next.js.
server {
    listen 443 ssl http2;

    server_name
        facildigitalmais.com;


    # SSL
    ssl_certificate
        /etc/letsencrypt/live/facildigitalmais.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/facildigitalmais.com/privkey.pem;

    ssl_protocols
        TLSv1.2
        TLSv1.3;

    ssl_ciphers
        HIGH:!aNULL:!MD5;


    # Headers de segurança
    add_header
        X-Frame-Options
        "SAMEORIGIN"
        always;

    add_header
        X-Content-Type-Options
        "nosniff"
        always;

    add_header
        X-XSS-Protection
        "1; mode=block"
        always;

    add_header
        Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    add_header
        Strict-Transport-Security
        "max-age=31536000; includeSubDomains"
        always;


    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss;


    # Assets estáticos também seguem para o Next.js.
    #
    # O próprio framework define os headers apropriados
    # para /_next/static. Não criamos location regex por
    # extensão porque isso poderia interceptar JS/CSS
    # antes de alcançar o reverse proxy.


    # Aplicação Next.js
    location / {
        proxy_pass
            http://127.0.0.1:3000;

        proxy_http_version
            1.1;

        proxy_set_header
            Upgrade
            $http_upgrade;

        proxy_set_header
            Connection
            "upgrade";

        proxy_set_header
            Host
            $host;

        proxy_set_header
            X-Forwarded-Host
            $host;

        proxy_set_header
            X-Real-IP
            $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_cache_bypass
            $http_upgrade;
    }


    # Webhooks externos.
    #
    # A autenticação do Mercado Pago continua sendo
    # realizada pela aplicação através da assinatura
    # oficial. Estes headers apenas preservam a
    # topologia HTTP real.
    location /api/webhooks/ {
        proxy_pass
            http://127.0.0.1:3000;

        proxy_http_version
            1.1;

        proxy_set_header
            Host
            $host;

        proxy_set_header
            X-Forwarded-Host
            $host;

        proxy_set_header
            X-Real-IP
            $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_read_timeout
            300s;

        proxy_connect_timeout
            300s;
    }


    # Limite de upload para PDFs.
    client_max_body_size
        10M;


    # Logs
    access_log
        /var/log/nginx/facil-digital-access.log;

    error_log
        /var/log/nginx/facil-digital-error.log;
}